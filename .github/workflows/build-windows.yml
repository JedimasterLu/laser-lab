name: Build Windows executable

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to attach files to a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Runtime dependencies of LaserScan + PyInstaller only; dev tools and the
      # camera/slm/rl extras must not end up in the bundle.
      - name: Install dependencies
        run: uv sync --no-dev --extra scan --group build

      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $pkg = uv run --no-sync python -c "import laserscan; print(laserscan.__version__)"
          if ("v$pkg" -ne $env:VERSION) {
            throw "Tag $env:VERSION does not match laserscan.__version__ ($pkg)."
          }

      - name: Build with PyInstaller
        run: uv run --no-sync pyinstaller packaging/laserscan.spec --noconfirm

      # Imports every lazily loaded module and loads the web UI inside QtWebEngine.
      - name: Smoke test
        shell: pwsh
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: |
          $proc = Start-Process -FilePath ".\dist\LaserScan\LaserScan.exe" -ArgumentList "--self-test" `
            -RedirectStandardOutput smoke.out.log -RedirectStandardError smoke.err.log -PassThru
          if (-not $proc.WaitForExit(120000)) { Stop-Process -Id $proc.Id -Force; $timeout = $true }
          Write-Host "--- stdout"; Get-Content smoke.out.log -ErrorAction SilentlyContinue
          Write-Host "--- stderr"; Get-Content smoke.err.log -ErrorAction SilentlyContinue
          if ($timeout) { throw "LaserScan --self-test did not finish within 120 s." }
          if ($proc.ExitCode -ne 0) { throw "LaserScan --self-test failed with code $($proc.ExitCode)." }

      - name: Package
        shell: pwsh
        run: |
          $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe"
          $name = "LaserScan-$env:VERSION-windows-x64"
          Push-Location dist
          & $sevenZip a -tzip -mx=9 "..\$name.zip" LaserScan
          Pop-Location
          Get-ChildItem "$name.*" | Format-Table Name, @{n = "MB"; e = { [math]::Round($_.Length / 1MB, 1) }}
          "{0:N0} MB unpacked" -f ((Get-ChildItem dist\LaserScan -Recurse | Measure-Object Length -Sum).Sum / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: LaserScan-${{ env.VERSION }}-windows-x64
          path: |
            LaserScan-*-windows-x64.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            LaserScan-*-windows-x64.zip
          generate_release_notes: true
